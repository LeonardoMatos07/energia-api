[project]
name = "energia-api"
version = "0.1.0"
description = "API da plataforma de dados de energia (Fase 1: monitor de curtailment eólico e solar)"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "alembic==1.20.0",
    "boto3==1.43.108",
    "cryptography==50.0.2",
    "email-validator==2.3.0",
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyjwt[crypto]==2.15.1",
    "sqlalchemy==2.1.3",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.uv]
package = false
# Every resolved package (including transitive ones) must be at least two weeks old.
exclude-newer = "2026-10-06T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "DTZ"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Starlette's TestClient still works on httpx; the httpx2 migration is not needed for tests.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
